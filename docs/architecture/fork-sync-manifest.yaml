# Fork sync manifest — read this BEFORE merging from upstream (koala73/worldmonitor).
#
# This fork intentionally diverges from upstream in four ways: removed Pro/Premium
# gating, removed Discord marketing links, removed personal attribution to the
# original founder, and ungated the API Keys settings tab. Upstream keeps adding
# new gating, new personal branding, and new marketing links in parallel — none of
# that is malicious, it's just upstream's own product direction. Every sync has to
# re-apply our divergence on top of whatever upstream shipped since last time.
#
# What this file is for:
#   1. `high_risk_files` — files where a CLEAN auto-merge (zero conflict markers)
#      has previously reintroduced gating/branding we'd already removed, or
#      silently reverted a real upstream fix we should have kept. Review these by
#      hand on every sync even when git reports no conflict.
#   2. `evaluated_upstream_commits` — specific upstream commits/patterns already
#      judged once. If the same commit (or a near-identical re-implementation)
#      shows up again, the decision below still applies — don't re-litigate from
#      scratch.
#   3. `protected_invariant_tests` — the existing test suite already encodes most
#      "this must never come back" rules. Run these FIRST after any sync, before
#      declaring the merge done. A green `git diff` with a red test here means the
#      merge is NOT actually finished.
#
# What this file is NOT: a substitute for `git merge -X ours` / a `.gitattributes`
# merge driver. Both were tried in spirit and both failed in practice this project
# — a blanket "keep ours" on vercel.json and index.html silently discarded a real
# content-corpus routing addition and a real SEO cloaking fix (see
# `evaluated_upstream_commits.keep` below). There is no shortcut around actually
# reading each high-risk file's diff.
#
# Tooling that reads this file (so the steps above are commands, not manual
# toil):
#   - `npm run fork-sync:check`  — BEFORE merging. Computes the real merge-base
#     fresh (never trusts meta.last_sync_upstream_head as the diff base), lists
#     incoming commits, flags any that touch high_risk_files, and cross-checks
#     commit SHAs / subject keywords against evaluated_upstream_commits.
#   - `npm run fork-sync:verify` — AFTER resolving conflicts. Runs
#     protected_invariant_tests and classifies every failing file against
#     known_pre_existing_gaps, so "is this pre-existing" doesn't require a
#     fresh git-worktree/ORIG_HEAD comparison every single sync. Add
#     `:full` to run the whole test:data suite instead of just the
#     gating-focused subset.
#   Neither script touches git state — read-only analysis and test runs only.
#
# Companion docs:
#   - remove_pro.md                                — full task-by-task Pro/Premium
#     removal audit (D1-D17, F1-F18, R1-R6, S1-S3, C1-C3), with file:line refs.
#   - docs/architecture/paid-capability-allowlist.md — the exhaustive list of what
#     is STILL genuinely paid (API/MCP access, scheduled digest delivery, Widget
#     Builder tier, priority refresh cache TTL). Anything not on that list that
#     looks gated is a bug, not a feature.
#   - docs/architecture/pro-monetization.md          — living architecture doc,
#     keep in sync with actual gating state on every sync (D17 caught it drifting
#     stale once already).

meta:
  upstream_remote: upstream
  upstream_repo: koala73/worldmonitor
  last_sync_commit: "PENDING"             # set to this sync's merge commit SHA in a follow-up commit
  last_sync_upstream_head: "bc99aad53"    # upstream/main SHA merged as of last sync
  # `git log bc99aad53..upstream/main --oneline` shows how far upstream has moved
  # since.
  #
  # Sync history:
  #   - 3645a1e29 -> d9a2d1f23: the 86-commit sync (see commit_ranges.upstream-sync).
  #   - b832237d4 -> df8467a2d: a 10-commit sync (SEC corporate-intelligence
  #     feature, a repo-wide HTML-entity-decode fix, an apiKeys.ts auth-race
  #     fix). Merge-base was b832237d4, NOT the previous last_sync_upstream_head
  #     — don't assume the two are equal; always compute
  #     `git merge-base <branch> upstream/main` fresh rather than trusting this
  #     file's last-recorded value as the diff base (scripts/fork-sync-check.mjs
  #     does this automatically now).
  #   - df8467a2d -> aa74d8947: a 5-commit sync (wm-session cookie-persistence
  #     recovery fix, intel-history untrusted-text/retraction handling, China
  #     cross-strait activity work). Zero conflicts, zero high-risk-file
  #     touches, zero new test failures beyond already-documented gaps —
  #     confirmed by scripts/fork-sync-check.mjs and
  #     scripts/fork-sync-verify.mjs, no manual worktree comparison needed.
  #   - aa74d8947 -> bc99aad53: a 45-commit sync (see commit_ranges.upstream-sync
  #     entry dated 2026-07-30). 22 real conflicts, all hand-resolved; the
  #     bigger risk this time was on files that merged CLEANLY: a blanket
  #     "restore deleted generated files from HEAD" wrongly reverted a
  #     legitimately-regenerated src/generated/market/v1 client/server pair,
  #     and a clean adoption of upstream's new firePremiumLoaders fan-out
  #     silently reintroduced clearGlobalTenders() (Global Tenders is free on
  #     this fork). Both caught by running the FULL test suite, not just
  #     protected_invariant_tests — see that entry for the complete story.
  categories: [pro-removal, discord-removal, owner-branding-removal, feature-ungate, upstream-sync, local-auth]

