  - category: local-auth
    range: "(uncommitted at time of writing — update to the real commit SHA once this lands)"
    summary: >
      Added a genuine local-only sign-in path that bypasses Clerk entirely
      when VITE_CLERK_PUBLISHABLE_KEY is unset (src/services/local-auth.ts;
      branch condition is isClerkAuthEnabled() in clerk.ts). This is a real
      user request ("bypass clerk completely, just have a local sign in"),
      not an upstream-inherited pattern — upstream will NEVER have this, so
      a clean auto-merge touching these files should be hand-reviewed for
      accidental reversion, not treated as "upstream wins by default."
      Root cause fixed: on a self-hosted install with no Clerk key,
      clicking "Sign In" silently did nothing (initClerk()/openSignIn()
      both bail out on a missing publishable key) while
      UnifiedSettings.ts's gate button closed the settings modal BEFORE the
      (silently failing) openSignIn() call — exactly reproducing "click
      Sign In, modal closes, nothing else happens." A second, related
      latent bug in the same area: scheduleClerkLoad() returned early
      without ever settling isPending, so getAuthState() stayed
      {user: null, isPending: true} forever whenever Clerk wasn't
      configured (isClerkAuthEnabled() existed but nothing acted on it).
      auth-state.ts's snapshotSession()/initAuthState()/subscribeAuthState()
      now branch on isClerkAuthEnabled(): real Clerk when configured, the
      new local-auth module otherwise (this also fixes the stuck-isPending
      bug). AuthHeaderWidget.ts, AuthLauncher.ts, UnifiedSettings.ts, and
      DeductionPanel.ts were switched from calling Clerk's
      openSignIn()/getCurrentClerkUser() directly to the provider-agnostic
      auth-state.ts signIn()/signOut()/getAuthState(), so both providers
      work transparently through the same call sites.
    convex_side: >
      convex/alertRules.ts, convex/notificationChannels.ts, and
      convex/users.ts (ensureRecord) were switched from raw
      ctx.auth.getUserIdentity() to resolveUserId/requireUserId
      (convex/lib/auth.ts) so a local session gets consistent identity
      resolution instead of always throwing UNAUTHENTICATED. This ONLY
      changes behavior when the target Convex deployment has
      CONVEX_IS_DEV=true set (an opt-in the user applies to their OWN
      deployment, documented in .env.example + SELF_HOSTING.md) —
      production/hosted Convex is unaffected either way. For alertRules.ts
      and notificationChannels.ts specifically, this is a correctness/
