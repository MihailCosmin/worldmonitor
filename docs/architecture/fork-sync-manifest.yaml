# ---------------------------------------------------------------------------
# 2. High-risk files — hand-review on every sync regardless of conflict markers.
# ---------------------------------------------------------------------------
high_risk_files:
  - path: src/shared/premium-paths.ts
    risk: >
      This is NOT a short list — it legitimately has ~28 entries on this fork's
      main (supply-chain, resilience, scenario, sanctions, trade, intelligence
      endpoints), all pre-existing and correct. Do not assume a long list means
      gating crept back in. DO check for entries that duplicate a feature this
      fork has explicitly made free.
    known_entries_to_exclude_if_upstream_adds_them:
      - /api/market/v1/analyze-stock
      - /api/market/v1/get-stock-analysis-history
      - /api/market/v1/backtest-stock
      - /api/market/v1/list-stored-stock-backtests
    companion_test: tests/premium-paths-guard.test.mts

  - path: server/_shared/entitlement-check.ts
    risk: "ENDPOINT_ENTITLEMENTS registry — same category of risk as premium-paths.ts."
    companion_test: tests/pro-gated-allowlist.test.mjs

  - path: convex/config/productCatalog.ts
    risk: >
      Single source of truth for pricing/marketingFeatures. New tier entries
      (e.g. a future SKU) auto-merge cleanly with zero conflict, but stale
      feature-count claims ("25 custom dashboards (vs 10)") slip through
      unreviewed inside them — this bit us once with the pro_business entry.
      Always re-run `npm run product:facts` after merging and re-read every
      marketingFeatures array for capability-count claims that don't match
      this fork's actual (ungated) feature set.

  - path: vercel.json
    risk: >
      Two independent concerns collide in one file: CSP script-src sha256
      hashes (recompute via `npx tsx --test tests/deploy-config.test.mjs` after
      ANY change to an un-nonced inline <script>) and content-corpus routing
      (/research/* redirects, cache headers, the SPA-catchall regex's excluded-
      segment list). A blanket `git checkout --ours` on the visible conflict has
      twice silently discarded legitimate unconflicted upstream additions
      elsewhere in the same file. Diff PARSED JSON (upstream vs current) to
      enumerate exactly what's missing — never just pick a side wholesale.
    mirrors: [docker/nginx.conf, docker/nginx-security-headers.conf]

  - path: pro-test/prerender.mjs
    risk: >
      Where JSON-LD founder/sameAs attribution and the Discord link both live.
      Also the exact file where the fix(seo) crawler-cloaking fix (7313562e4)
      was accidentally reverted once during conflict resolution, because
      resolving the Discord/branding conflict "kept ours" without noticing
      upstream had ALSO shipped an unrelated correctness fix in the same hunk.
    also_check: [pro-test/index.html, pro-test/welcome.html, index.html]

  - path: index.html
    risk: >
      Same JSON-LD attribution/gating overlap as pro-test/prerender.mjs, PLUS
      it's the file where fix(seo) 7313562e4 (crawler-only prerender content →
      real noscript fallback) and fix(i18n) 534a3efd9 (hreflang query-locale
      alternates) both live. If either pattern (`#seo-prerender` div + CSS hide
      rule, or `hreflang="xx" href="...?lang=xx"` link tags) is present again
      after a merge, one of those two fixes got reverted — re-adopt it, don't
      just re-strip branding on top of the reverted state.
    companion_tests: [tests/pro-critical-css.test.mjs, tests/indexable-content-visibility.test.mjs, tests/i18n-hreflang-contract.test.mts]

  - path: src/app/panel-layout.ts
    risk: >
      Touched by every category: Pro nav links (removed), Discord footer link
      (removed), @eliehabib credit-link + site-footer byline (removed), AND
      it's where upstream adds new content-corpus reference links
      (DASHBOARD_REFERENCE_LINKS) and nav restructuring. High conflict surface.

  - path: src/styles/main.css
    risk: >
      Every gating/branding removal pass leaves CSS behind if the corresponding
      markup removal isn't done in the same edit. Orphaned selectors for
      deleted UI (.panel-pro-badge, .credit-link, .map-author-badge,
      .export-locked-state, .tab-cap-notice-*) are easy to miss on a merge —
      cross-check every selector removed/kept against components actually
      still rendered, not just against the visible conflict hunk.

  - path: blog-site/src/layouts/BlogPost.astro
    also: blog-site/src/pages/index.astro
    risk: >
      DEFAULT_AUTHOR now resolves to the "World Monitor" Organization, not a
      named Person — a naive merge favoring upstream's version here silently
      reintroduces personal-founder attribution as the default blog author.

  - path: src/services/auth-state.ts
    risk: >
      Upstream always has Clerk configured (its own hosted deployment), so
      it has no reason to ever add an `isClerkAuthEnabled()` branch here —
      but it MAY touch snapshotSession()/initAuthState()/subscribeAuthState()
      for its own reasons (new Clerk fields, a new session shape) and a
      merge could drop the `!isClerkAuthEnabled()` local-auth branch instead
      of threading it through. Losing that branch silently reintroduces the
      original bug this fork fixed: Sign In does nothing when no Clerk key
      is configured, and getAuthState() stays {user: null, isPending: true}
      forever. Also re-check the signIn()/signOut() exports still branch on
      isClerkAuthEnabled() rather than calling Clerk unconditionally.
    also: [src/services/local-auth.ts, src/services/clerk.ts]

  - path: src/components/AuthHeaderWidget.ts
    risk: >
      renderSignedOut()/renderSignedIn() branch on isClerkAuthEnabled() to
      decide between mounting a real Clerk UserButton vs. a plain
      local-session chip. A merge that reintroduces a direct
      openSignIn()/mountUserButton() call with no local-mode fallback
      silently breaks the header widget for local sessions (Clerk calls
      silently no-op with no key configured).
    also: [src/components/AuthLauncher.ts, src/components/UnifiedSettings.ts, src/components/DeductionPanel.ts]

  - path: src/generated/**
    risk: >
      Committed sebuf-generated RPC client/server code (protoc-gen-ts-client
      output) — NOT purely a build artifact you can restore-or-delete as a
      block. When a path here shows as cleanly deleted by the merge, check
      base/ours/theirs individually (`git show <rev>:<path>` for the
      merge-base, HEAD, and upstream/main) before deciding: most of the time
      it really is "theirs deleted, ours never touched" (safe to restore
      from HEAD, matching docs/api/'s restructure below), but a path can
      also be "theirs changed, ours never touched" — a plain regeneration
      you must take FROM upstream, not revert. A blanket `git checkout HEAD
      -- src/generated/` reverted src/generated/{client,server}/worldmonitor/
      market/v1/service_*.ts to stale pre-sync content this way during the
      aa74d8947..bc99aad53 sync, breaking `tsc --noEmit` against code that
      correctly expected the new fields. `make generate` (needs go+buf) is
      the real fix when available; absent that, per-file 3-way
      classification is the only safe manual substitute.
    also: [docs/api/**]

  - path: src/App.ts
    risk: >
      Home to `firePremiumLoaders` upstream's entitlement-transition fan-out
      helper, added upstream to fire PRO-gated initial loads on a free→pro
      transition and clear Pro-only caches on downgrade. This fork's public
      panels (trade policy, stock analysis/backtest, daily market brief,
      global tenders, resilience ranking, ...) already free-load via the
      normal shouldPrime()/scheduleRefresh() lifecycle and don't need this
      fan-out at all — tests/premium-loaders-fan-out-coverage.test.mts
      asserts `firePremiumLoaders` must not exist in this file. A clean
      merge will silently re-add it (and its clearGlobalTenders() downgrade
      call, which references a data-loader.ts method this fork deleted
      outright since Global Tenders is free). If upstream adds a genuinely
      new premium loader in a future sync, thread it into the existing
      shouldPrime/scheduleRefresh calls instead of reviving this helper.
    companion_test: tests/premium-loaders-fan-out-coverage.test.mts

  - path: src/components/CountryDeepDivePanel.ts
    risk: >
      The most dangerous file of the bc99aad53..ab798e628 sync, precisely
      because it looked safe: its only conflict was a single import line
      (`getCSSColor` vs `getCSSColor, isMobileDevice, showToast`). Resolving
      that with `git checkout --theirs` silently accepted upstream's whole
      version of the file, which locks bypass corridors, the cost-shock
      calculator, product imports, national debt, sanctions and trade flows
      behind makeProLocked('Upgrade to PRO for …'). Nothing conflicted, it
      compiled, and only the divergence lock caught it.

      Upstream's genuinely-new work here is the overlay-history mobile
      back-button support (hide(origin), historyRegistered, the
      isMobileDevice() branch in show()) — port that onto this fork's
      version rather than taking the file.

  - path: src/app/event-handlers.ts
    risk: >
      Where upstream hangs each new gate's wiring: the export-gate control
      and its lockedReason/isUnlocked state machine, the playback gate's
      applyGate()/evaluatePlaybackGate() visibility toggle, and the
      free-tier panel/source cap imports. All six of this sync's conflicts
      here were gating, so `--ours` was right — but that also drops
      upstream's non-gating changes from the same hunks. This sync had to
      port back the #5376 invalidateNewsHydration() call in
      restoreSnapshot() and LazyUnifiedSettings' close()/hasPendingChanges()
      plus its history-aware open(). Typecheck after taking `--ours` here;
      the dropped pieces surface as missing interface members.

  - path: src/components/UnifiedSettings.ts
    risk: >
      Five interleaved conflicts mixing the fork's renderSettingsHelpSection
      (which replaces every upsell branch) with upstream's overlay-history
      close(origin) signature that the REST of the file already calls from
      cleanly-merged regions. Resolve by content match, not hunk index — see
      lesson 2 in the bc99aad53..ab798e628 commit_ranges entry.
    also: [src/app/app-context.ts]

  - path: public/pro/**
    risk: >
      Never merge; rebuild. Resolving these conflicts to either side leaves
      the directory holding assets from two different Vite builds — after
      this sync's merge it held 66 files / 7.7 MB against a 6 MB cap, failing
      tests/pro-critical-path-budget.test.mts, tests/pro-welcome-prerender
      and tests/pro-locale-registry at once. `npm run build:pro` (from the
      reviewed pro-test/ sources) restored 38 files / 5.3 MB and fixed all
      three. The conflict_policy rule takes upstream's side only so the tree
      is parseable until the rebuild runs.
    companion_tests: [tests/pro-critical-path-budget.test.mts, tests/pro-welcome-prerender.test.mjs, tests/pro-locale-registry.test.mjs, tests/pro-sentry-chunk.test.mjs]

# ---------------------------------------------------------------------------
# 3. Upstream commits/patterns already evaluated — the decision still applies
#    if the same commit, a rebase of it, or a near-identical reimplementation
#    reappears.
# ---------------------------------------------------------------------------
evaluated_upstream_commits:
  keep:
    - sha: "7313562e4"
      title: "fix(seo): replace crawler-only prerender content"
      reason: >
        Genuine cloaking-risk fix (upstream's own realization that hiding
        content from JS users while showing it to no-JS crawlers is an SEO
        anti-pattern), unrelated to gating. Adopt in full if reverted.
    - sha: "534a3efd9"
      title: "fix(i18n): stop advertising query locale alternates"
      reason: >
        Genuine hreflang correctness fix (query-string locale variants aren't
        separate indexable pages). Adopt in full if reverted.
    - pattern: "server/_shared/pro-entitlement.ts / pro-mcp-gate.ts DRY extraction"
      reason: >
        Consolidates tier-check/MCP-grant logic previously duplicated across
        several API routes — a refactor, not a new restriction. Exact upstream
        commit SHA not recorded; judge future changes to these two files by
        whether they still just extract EXISTING entitlement-check.ts logic.
  exclude:
    - pattern: "ExportGateControl / export-gate.ts / pro-banner-policy.ts / gate-icons.ts"
      reason: "New export-gating feature built in parallel to our de-gating work."
    - pattern: "PanelTabBar.ts locked-state / tab-cap machinery"
      reason: "New dashboard-tab-count paywall."
    - pattern: "requirePremiumRpcAccess on scenario/v1 run-scenario or get-scenario-status"
      reason: >
        Genuinely-free supply-chain scenario service; do not confuse with the
        actually-gated forecast/v1/trigger-simulation.
    - pattern: "api/latest-brief.ts pro_required 403"
      reason: "This fork's shared-dashboard-edition fallback already makes Latest Brief free."
    - pattern: "api/chat-analyst.ts resolvePremiumCallerIdentity / 403 Pro-gate"
      reason: "Keep the 401-only resolveAuthenticatedCallerIdentity gate instead."
    - pattern: "src/services/gates/** (export.ts, export-resolver.ts, playback.ts, playback-resolver.ts)"
      reason: >
        Upstream's new home for the export gate this fork already deleted
        (src/services/export-gate.ts), plus a new playback gate. Git reports
        the modify/delete conflict under the NEW path, so match on the
        merge-base blob rather than the filename — scripts/fork-sync-run.mjs
        does this automatically. src/utils/export.ts must be kept at this
        fork's version too: upstream's only change to it is the
        availableFormats plumbing that hides formats behind the gate.
    - pattern: "src/components/premium-layer-gate.ts / map-layer premium locking (#6045, #6049, #6050)"
      reason: >
        New paywall on MAP LAYERS — locks CMD+K layer toggles, disables the
        checkbox, appends a 🔒 to the label and stamps a PRO badge on the
        Resilience layer. This fork keeps resilienceScore at
        `premium: undefined` in src/config/map-layer-definitions.ts, so all
        56 layers are free. Touches DeckGLMap.ts, GlobeMap.ts,
        MapContainer.ts and search-manager.ts; its dedicated tests
        (map-svg-layer-gate, dom/globe-premium-layer-gate,
        search-cmdk-premium-layer-gate, map-layer-initial-url-gate,
        docs-stats-plan-layer-entitlement) come with it and go with it.
    - pattern: "docs copy claiming '55 of 56 map layers free' / 'Resilience is Pro' (#5387)"
      reason: >
        True upstream, false here. Any pricing/accounts copy correction that
        carves Resilience out of the free layer set contradicts this fork's
        registry — keep "56 map layers" with no caveat.
    - pattern: "cloud-prefs migrations 3-6 / regional-feed-rollout / source-cap fingerprinting"
      reason: >
        Upstream's schema-3..6 recovery migrations use FREE_MAX_SOURCES and
        computeCapDisabledSources only as a FINGERPRINT of legacy cap state —
        but this fork deleted src/services/source-cap.ts along with the caps
        themselves, so they cannot compile here.
        src/services/regional-feed-rollout.ts comes with them and is
        unreachable from app code without them. Keeping the fork's retired
        (empty) migration registry means this fork does not get upstream's
        regional-default recovery; adopting it would mean resurrecting
        source-cap.ts, which is a deliberate project, not a merge resolution.

# ---------------------------------------------------------------------------
# 4. Contamination patterns — read by scripts/fork-sync-scan.mjs.
#
#    These match against ADDED lines only. The divergence lock covers "did the
#    merge undo something we did"; this covers the case the lock structurally
#    cannot see — gating that is brand new, that we never removed because it
#    never existed here. Most of what needs catching on any given sync is this
#    kind, since upstream keeps building its monetization layer.
#
#    severity: critical  → blocks the sync until removed or allowlisted
#              warn      → reported, does not block; judge against
#                          docs/architecture/paid-capability-allowlist.md
#    allow_paths          → globs where a match is legitimate, not a violation
#
#    Editing this list changes the scan with no code change. If the section is
#    deleted, scripts/fork-sync-scan.mjs falls back to its own built-in copy
#    rather than silently passing everything.
# ---------------------------------------------------------------------------
contamination_patterns:
  - id: panel-gating
    severity: critical
    regex: 'showLocked\s*\(|panel-locked-|panel-pro-badge|panel-is-locked|\bWEB_PREMIUM_PANELS\b|\bupdatePanelGating\b|\bgetGateAction\b|\bgetProPanelKeys\b|\bPanelGateReason\b|\bresolveBillingAwareGateReason\b'
    reason: >
      D13 panel-gate machinery this fork deleted. tests/remove-pro-cleanup.test.mjs
      bans these identifiers from Panel.ts / panel-layout.ts / panels.ts /
      panel-gating.ts even inside comments.

  - id: export-gate
    severity: critical
    regex: '\bExportGateControl\b|services/export-gate|\bcanExportStructuredData\b|\bcanExportEvidenceBundle\b|export-locked-state'
    reason: >
      Upstream's export paywall, excluded wholesale (see
      evaluated_upstream_commits.exclude). Upstream has since moved it under
      src/services/gates/ — the identifiers travel with it.

  - id: tab-cap
    severity: critical
    regex: 'tab-cap-notice|\bTAB_CAP\b|\btabCapReached\b|\bmaxDashboardTabs\b'
    reason: "Upstream's dashboard-tab-count paywall (PanelTabBar locked-state machinery)."

  - id: pro-banner
    severity: critical
    regex: '\bProBanner\b|pro-banner-policy|components\.proBanner|\bshouldShowProBanner\b'
    reason: "Pure upsell surface, deleted outright. Locale bundles must not define components.proBanner."

  - id: premium-loaders
    severity: critical
    regex: '\bfirePremiumLoaders\b|\bclearGlobalTenders\b'
    reason: >
      Entitlement-transition fan-out this fork removed;
      tests/premium-loaders-fan-out-coverage.test.mts asserts it must not exist
      in src/App.ts. clearGlobalTenders() additionally references a
      data-loader.ts method this fork deleted (Global Tenders is free here), so
      adopting it does not even compile.

  - id: ungated-endpoint-regating
    severity: critical
    regex: "'/api/market/v1/(analyze-stock|backtest-stock|get-stock-analysis-history|list-stored-stock-backtests)'|'/api/intelligence/v1/(get-country-intel-brief|deduct-situation)'|'/api/scenario/v1/(run-scenario|get-scenario-status)'"
    reason: >
      Endpoints this fork made free. A new occurrence only matters inside
      PREMIUM_RPC_PATHS / ENDPOINT_ENTITLEMENTS — hence the allow_paths for the
      call sites and tests that legitimately name them.

      server/_shared/rate-limit.ts is exempt for a different reason: a rate
      limit is not an entitlement gate. "Free" means no plan is required, not
      unmetered — an LLM-backed route like analyze-stock needs abuse defence
      precisely BECAUSE anyone can call it. Upstream adding a
      requests-per-minute budget there is compatible with this fork, and
      indistinguishable from re-gating by string match alone.
    allow_paths: ['tests/**', 'docs/**', 'src/services/**', 'src/app/**', 'server/_shared/rate-limit.ts']

  - id: upsell-copy
    severity: critical
    regex: 'Upgrade to Pro\b|Upgrade to PRO\b|Sign In to Unlock|Pro is launched|premium analytics|Unlock with Pro'
    reason: >
      Upsell copy stripped from every locale bundle and component in the
      DASHBOARD. New upstream locales (uk.json etc.) arrive carrying the full
      set and need the same treatment as the other 25.

      pro-test/ is exempt: it is the /pro marketing site, whose entire purpose
      is selling Pro. This fork's own pro-test/src/locales/en.json still
      defines nav.upgradeToPro. What DOES matter there is the accuracy of the
      claims (this fork trimmed proF7-proF9 and the WM-Analyst-led framing
      because those capabilities are free here) — a correctness question the
      `manual` conflict_policy on pro-test/index.html covers, not a
      string-match one.
    allow_paths: ['pro-test/**']

  - id: founder-branding
    severity: critical
    regex: 'eliehabib|Elie\s+Habib|elie-habib'
    reason: >
      Personal attribution to the original founder, removed from all branding
      surfaces. LICENSE copyright notices are the deliberate exception (AGPL/MIT
      require preserving them — a legal question, not a branding one), as are
      docs/audits/ and docs/plans/ dated internal records.
    allow_paths:
      - LICENSE
      - cli/LICENSE
      - sdk/**/LICENSE
      - docs/audits/**
      - docs/plans/**

  - id: discord-marketing
    severity: critical
    regex: 'discord\.gg/|Join the Discord|CommunityWidget'
    reason: >
      Discord MARKETING links only. The functional Discord notification channel
      (OAuth connect flow, webhook delivery to a user's own server) is
      deliberately KEPT — a match inside notification-channel code is a false
      positive, not a regression.
    allow_paths:
      - convex/notificationChannels.ts
      - server/**/notification*
      - src/services/notification*

  - id: new-premium-gate
    severity: warn
    regex: '\brequirePremiumRpcAccess\b|\bassertProEntitlement\b|\bhasPremiumAccess\b|pro_required|PRO_REQUIRED'
    reason: >
      Legitimate on the genuinely-paid surfaces in
      docs/architecture/paid-capability-allowlist.md (API/MCP access, scheduled
      digest delivery, Widget Builder tier). Anywhere else it is new gating —
      read the call site before accepting.

  - id: premium-registry-growth
    severity: warn
    regex: '\bPREMIUM_RPC_PATHS\b|\bENDPOINT_ENTITLEMENTS\b'
    reason: >
      A new entry in either registry gates an endpoint. Confirm against
      paid-capability-allowlist.md, and against the
      "endpoint-not-in-PREMIUM_RPC_PATHS dedicated tests" gap cluster below —
      that cluster is existing debt these registries should be shrinking
      toward, not growing away from.

# ---------------------------------------------------------------------------
# 5. Conflict policy — read by scripts/fork-sync-run.mjs --merge.
#
#    First matching rule wins, so order matters. Each rule encodes a decision an
#    earlier sync already made by hand (see the conflicts_resolved entries in
#    commit_ranges above); the point is to stop re-making them.
#
#    strategy: ours     → keep this fork's version, stage it
#              theirs   → take upstream's version, stage it
#              manual   → never auto-resolve; stop and require a human
#    regenerate_with    → command that must run afterwards to produce the real
#                         content (the chosen side is only a parseable
#                         placeholder for build artifacts)
#
#    Anything with no matching rule defaults to `manual`. That default is the
#    safe one: a new conflict class should surface, not get silently picked.
# ---------------------------------------------------------------------------
conflict_policy:
  - path: package-lock.json
    strategy: theirs
    regenerate_with: npm install
    reason: "Lockfile conflicts are never meaningful; regenerate from the merged package.json."

  - path: public/pro/**
    strategy: theirs
    regenerate_with: npm run build:pro
    reason: >
      Vite content-hashed build output. Taking a side per-file is what dropped
      public/pro/assets/index-BOTuWg_3.js during the aa74d8947..bc99aad53 sync
      while the kept (--ours) index.html still modulepreloaded it by exact
      hash-named filename. Take upstream's whole tree so HTML and assets stay
      internally consistent, then rebuild from pro-test/ — which is the source
      of truth and IS reviewed.

  - path: src/generated/**
    strategy: theirs
    regenerate_with: make generate
    reason: >
      Committed sebuf output. Upstream's copy corresponds to the merged protos
      (this fork's own proto edits are documentation-only enrichments), so
      theirs is the right side — the opposite of the blanket
      `git checkout HEAD -- src/generated/` that reverted the market/v1 client
      to stale pre-sync content last sync. Still regenerate for real when
      go+buf are available.

  - path: docs/api/*.openapi.json
    strategy: theirs
    regenerate_with: make generate && npm run build:openapi
    reason: >
      Generated from proto; upstream's copy has the newer schema. Regenerate
      rather than hand-merge. NOTE these are single-line JSON, so a conflict is
      one enormous hunk and an unresolved one leaves `<<<<<<< HEAD` as line 1 —
      which is why the audit now sweeps the whole tree for markers.

  - path: '**/product-catalog.generated.json'
    strategy: theirs
    regenerate_with: npm run product:facts
    reason: "Generated from convex/config/productCatalog.ts. Review the SOURCE (it is in high_risk_files); the derived copies just get regenerated."
  - path: '**/product-facts.generated.json'
    strategy: theirs
    regenerate_with: npm run product:facts
    reason: "Same generator as product-catalog.generated.json."
  - path: api/_product-catalog.generated.js
    strategy: theirs
    regenerate_with: npm run product:facts
    reason: "Same generator, JS mirror for the edge runtime."
  - path: public/product-facts.json
    strategy: theirs
    regenerate_with: npm run product:facts
    reason: "Same generator, public copy."

  - path: '**/source-attribution-manifest.json'
    strategy: theirs
    regenerate_with: node scripts/source-attribution.mjs --write
    reason: >
      Generated registry of every upstream data source and where it is
      referenced. It needs regeneration on this fork specifically: it records
      reference PATHS, and deleting a component (CommunityWidget.ts, with the
      Discord pill) leaves a stale entry pointing at a file that no longer
      exists — which then fails `npm run product:facts`'s validator with
      "manifest marks discord.gg observed but scanner found no current
      reference". `--write` flips observed to false; an entry whose only
      reference was the deleted file should be dropped outright.

      scripts/shared/source-attribution-manifest.json is a hand-maintained
      MIRROR of shared/ (guarded by tests/scripts-shared-mirror.test.mjs) —
      `--write` does not update it, so copy it across afterwards.

  # --- everything below is deliberately NOT automatable -------------------
  - path: docs/api/*.openapi.yaml
    strategy: manual
    reason: >
      Not symmetric with the .json above: this fork hand-edits description text
      here ("Free for all users." insertions) that upstream does not have, and
      those edits collide with upstream's schema additions. Needs the 3-way
      treatment documented in the aa74d8947..bc99aad53 entry — generate from
      upstream, replay this fork's description edits using the already-merged
      proto rpc comments as the source of truth.

  - path: vercel.json
    strategy: manual
    reason: "CSP sha256 hashes and content-corpus routing collide here; picking a side has twice discarded unconflicted upstream additions. Diff parsed JSON."

  - path: src/locales/*.json
    strategy: json-replay
    reason: >
      Neither side is a superset: upstream ships new keys and retranslations we
      want, this fork carries the removals that define it. Replaying the fork's
      key-level delta (recomputed from the merge-base each sync, not hardcoded)
      onto upstream's file is exact where picking a side is not. Currently
      resolves to -28 keys (premium.*, components.proBanner.*,
      components.exportGate.*, components.tabCap.*, the free-tier panel/source
      limit strings, components.community.joinDiscussion), 6 rewrites and 11
      additions (local-auth strings, the Data Sources / Log tabs).

      NOTE: a locale upstream adds that has never existed here (uk.json in the
      bc99aad53..ab798e628 sync) is not a conflict at all — it merges cleanly
      carrying the full upsell set, and only the contamination scan catches it.
      Check `upsell-copy` and `pro-banner` scan hits for new locale files after
      every sync.

  - path: pro-test/src/locales/*.json
    strategy: json-replay
    reason: "Same as src/locales, for the marketing site."

  - path: index.html
    strategy: manual
    reason: "JSON-LD founder attribution overlaps the fix(seo) 7313562e4 and fix(i18n) 534a3efd9 hunks — see high_risk_files."

  - path: src/styles/main.css
    strategy: manual
    reason: "Orphaned selectors for deleted gating UI are only detectable against what components actually render."

  - path: src/App.ts
    strategy: manual
    reason: "firePremiumLoaders lands here. See high_risk_files."

  - path: src/app/panel-layout.ts
    strategy: manual
    reason: "Touched by every divergence category at once. Highest conflict surface in the repo."

# ---------------------------------------------------------------------------
# 6. Run these after every sync, before declaring the merge finished. A test
#    failure here with zero git conflict markers means something slipped back
#    in silently — go find it, don't just note the test as "newly failing."
# ---------------------------------------------------------------------------
protected_invariant_tests:
  - tests/remove-pro-cleanup.test.mjs
  - tests/premium-paths-guard.test.mts
  - tests/pro-gated-allowlist.test.mjs
  - tests/blog-seo-contract.test.mjs
  - tests/i18n-hreflang-contract.test.mts
  - tests/indexable-content-visibility.test.mjs
  - tests/pro-critical-css.test.mjs
  - tests/deploy-config.test.mjs
  - tests/premium-loaders-fan-out-coverage.test.mts
  - convex/__tests__/apiKeys.test.ts

# Known gaps in the above, so they aren't mistaken for sync regressions.
known_pre_existing_gaps:
  - test: tests/pro-gated-allowlist.test.mjs
    issue: >
      Its hardcoded EXPECTED_PREMIUM_RPC_PATHS (5 entries) and
      EXPECTED_ENDPOINT_ENTITLEMENTS (2 entries) are stale — the real registries
      have grown to ~28/~5 legitimate entries over time and nobody updated the
      test's expectations. Fails on a clean checkout of main, independent of
      any sync. Needs a dedicated fix (update the hardcoded arrays to match
      current reality), not a merge-conflict resolution.
  - test: tests/pro-locale-freshness.test.mjs
    issue: >
      Non-English pro-test locales carry English-fallback text pending a real
      translation pass. Fix:
      `ANTHROPIC_API_KEY=... node scripts/translate-locales.mjs --pro-test`
      (then rebuild pro-test and commit public/pro/). No key available when
      this gap was last confirmed.

      The drift GROWS on every sync that changes pro-test/src/locales/en.json
      — it was 24 locales at the aa74d8947..bc99aad53 sync and reports "50
      English strings no longer match" after bc99aad53..ab798e628, which also
      added a 26th locale (uk). Same untranslated-fallback cause, larger
      count; not a sync regression. Note the json-replay conflict strategy
      deliberately keeps this fork's rewritten English strings (it trimmed
      proF7-proF9 and the WM-Analyst-led framing), so this gap cannot close
      by merging upstream translations — it needs the translation pass.
  - test: tests/locale-staleness.test.mjs
    issue: >
      Depends on `Intl.PluralRules` category ordering, which is ICU-version-
      dependent and not guaranteed by spec. Fails on this Node's ICU build
      independent of any sync; a pre-existing upstream test/environment issue.
  - test: tests/wm-session-auto-refresh.test.mts
    issue: >
      One subtest ("does NOT retry when the path is in PREMIUM_RPC_PATHS")
      hardcodes `/api/market/v1/analyze-stock` as its example premium path —
      stale, since this fork made stock analysis free. Confirmed pre-existing
      on main, unrelated to any sync.
  - test: tests/premium-paths-guard.test.mts
    issue: >
      One subtest ("every direct-LLM bypass also proves how its 401s stay out
      of session recovery") cannot verify
      /api/intelligence/v1/get-country-intel-brief: its caller
      (src/app/country-intel.ts) makes a bare premiumFetch(url, {forcePremium:
      true}) call with no RPC-client wrapper, and the test's AST proof only
      knows how to bind a "marked client variable" and count
      `client.rpcMethod(...)` calls. Manually confirmed forcePremium: true IS
      set correctly at the call site (src/app/country-intel.ts:~930) — this is
      a test-coverage gap, not an actual wiring bug. Fixing it properly means
      extending the test's AST logic to also recognize a bare premiumFetch
      call bound directly to a route (no client indirection), which is a
      small feature addition to the test, not a merge-conflict resolution.
  - cluster: "endpoint-not-in-PREMIUM_RPC_PATHS dedicated tests"
    tests: [tests/get-regime-history.test.mts, tests/get-regional-snapshot.test.mts, tests/global-procurement-ui-guard.test.mts, tests/multi-sector-cost-shock.test.mjs, tests/regional-snapshot-weekly-brief.test.mjs, tests/resilience-map-layer.test.mts, tests/resilience-runtime-manifest.test.mts, tests/supply-chain-sprint2.test.mjs, tests/openapi-security-contract.test.mjs, tests/premium-stock-gateway.test.mts]
    issue: >
      A larger, separate body of pre-existing gating debt discovered while
      auditing the b832237d4..df8467a2d sync (2026-07-29) — confirmed via
      ORIG_HEAD comparison to be unrelated to that sync. These dedicated
      per-endpoint tests each assert a specific endpoint (get-regime-history,
      get-regional-snapshot, get-bypass-options, get-country-cost-shock,
      get-sector-dependency, get-resilience-score, get-resilience-ranking,
      multi-sector-cost-shock, global procurement, and others) should NOT be
      in PREMIUM_RPC_PATHS / ENDPOINT_ENTITLEMENTS, but they still are.
      Distinct from the 3 bugs already fixed in this sync's commit_ranges
      entry: those 3 were leftover registry entries for endpoints ALREADY
      excluded from ONE of the two registries (an inconsistency between them).
      This cluster is endpoints present and CONSISTENT in both registries,
      but that per-endpoint tests say shouldn't be gated at all — i.e. this
      may be a larger, not-yet-completed slice of remove_pro.md's D8/D9
      ungating mandate (regional/resilience/supply-chain reads). NOT fixed as
      part of this sync — out of scope for "sync N commits," needs its own
      dedicated pass to verify each endpoint's intended status before
      touching the registries again. Do not assume premium-paths.ts's ~28
      entries are uniformly "fine as-is" on a future sync without checking
      this cluster first.
  - tests: [tests/bootstrap-r2-reader.test.mjs, tests/dashboard-critical-css.test.mjs, tests/dockerfile-digest-notifications-imports.test.mjs, tests/oref-breaking.test.mjs, tests/panel-layout-dynamic-import-guard.test.mts, tests/responsive-zone-listener.test.mjs]
    issue: >
      Confirmed pre-existing on main via repeated ORIG_HEAD/worktree
      comparisons across multiple syncs — none touch Pro/Premium/Discord/
      branding surfaces (R2 credential mocking, critical-CSS graph, Dockerfile
      COPY-closure audit, OREF siren wiring, dynamic-import guard, panel
      responsive-zone listener cleanup). Not investigated further; unrelated
      to fork-specific divergence.
  - tests: [tests/renewable-energy-last-known-good.test.mts, tests/seed-env-hermeticity.test.mjs]
    issue: >
      Flaky under `--test-concurrency=16`, not a real regression — both pass
      100% when run standalone (confirmed by direct repeat runs). Likely
      resource/timing contention between concurrently-running test files
      rather than a code defect.
